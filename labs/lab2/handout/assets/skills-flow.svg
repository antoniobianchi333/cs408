<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 640 395" role="img" aria-labelledby="title desc">
<title id="title">Skills are selected first and read on demand</title><desc id="desc">A YAML list selects skill folders. The initial prompt shows a short catalog. The agent later reads a skill and optional reference files only as needed.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5 0 9" fill="none" stroke="#087c77" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="638" height="393" rx="12" fill="#f7fafb" stroke="#dbe5e8"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="28" y="24" width="584" height="75" rx="8" fill="#fff" stroke="#cfdde1"/>
<text x="320" y="56" font-size="24" font-weight="600" fill="#18313d">1. Select skill folders</text><text x="320" y="82" font-size="18" fill="#596c77">skillsets/my-list.yaml</text>
<rect x="28" y="139" width="584" height="75" rx="8" fill="#eaf5f2" stroke="#b9d9d3"/>
<text x="320" y="171" font-size="24" font-weight="600" fill="#075c59">2. Start with a short catalog</text><text x="320" y="197" font-size="18" fill="#4f6d73">name · description · location</text>
<rect x="28" y="272" width="260" height="92" rx="8" fill="#fff" stroke="#cfdde1"/>
<text x="158" y="309" font-size="22" font-weight="600" fill="#18313d">3. Open skill.yaml</text><text x="158" y="338" font-size="18" fill="#596c77">read the full instructions</text>
<rect x="352" y="272" width="260" height="92" rx="8" fill="#fff" stroke="#cfdde1"/>
<text x="482" y="309" font-size="22" font-weight="600" fill="#18313d">4. Read a reference</text><text x="482" y="338" font-size="18" fill="#596c77">only if needed</text>
</g>
<g stroke="#087c77" stroke-width="2.2" fill="none" marker-end="url(#arrow)"><path d="M320 103V129"/><path d="M320 218V243H158V260"/><path d="M295 318H340"/></g>
</svg>
