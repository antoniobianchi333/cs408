<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">Two task types and their required test results</title><desc id="desc">For Test Writing, tests pass correct code and fail faulty variants. For Issue Reproduction, bug checks fail unfixed code and pass the reference repair.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5 0 9" fill="none" stroke="#6a818c" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="638" height="418" rx="12" fill="#f7fafb" stroke="#dbe5e8"/>
<g font-family="Arial,sans-serif">
<text x="28" y="39" fill="#18313d" font-size="23" font-weight="600">Test Writing</text>
<text x="28" y="234" fill="#18313d" font-size="23" font-weight="600">Issue Reproduction</text>
<g font-size="24" text-anchor="middle">
<rect x="28" y="59" width="273" height="48" rx="7" fill="#fff" stroke="#cfdde1"/><text x="164" y="91" fill="#18313d">Correct code</text>
<rect x="28" y="121" width="273" height="48" rx="7" fill="#fff" stroke="#cfdde1"/><text x="164" y="153" fill="#18313d">Faulty variant</text>
<rect x="421" y="59" width="191" height="48" rx="7" fill="#eaf5f2" stroke="#b9d9d3"/><text x="516" y="91" fill="#075c59" font-weight="600">PASS</text>
<rect x="421" y="121" width="191" height="48" rx="7" fill="#fff4e5" stroke="#e7d3b1"/><text x="516" y="153" fill="#835814" font-weight="600">FAIL</text>
<rect x="28" y="254" width="273" height="48" rx="7" fill="#fff" stroke="#cfdde1"/><text x="164" y="286" fill="#18313d">Unfixed code</text>
<rect x="28" y="316" width="273" height="48" rx="7" fill="#fff" stroke="#cfdde1"/><text x="164" y="348" fill="#18313d">Reference repair</text>
<rect x="421" y="254" width="191" height="48" rx="7" fill="#fff4e5" stroke="#e7d3b1"/><text x="516" y="286" fill="#835814" font-weight="600">FAIL</text>
<rect x="421" y="316" width="191" height="48" rx="7" fill="#eaf5f2" stroke="#b9d9d3"/><text x="516" y="348" fill="#075c59" font-weight="600">PASS</text>
</g>
<text x="28" y="396" font-size="17" fill="#596c77">IR also checks faulty variants. Existing-behavior checks pass both versions.</text>
</g>
<g stroke="#6a818c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"><path d="M313 83H407"/><path d="M313 145H407"/><path d="M313 278H407"/><path d="M313 340H407"/></g>
<path d="M28 195H612" stroke="#dbe5e8" stroke-width="1"/>
</svg>
