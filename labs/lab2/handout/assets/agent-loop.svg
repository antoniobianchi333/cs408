<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 640 345" role="img" aria-labelledby="title desc">
<title id="title">The coding-agent loop</title><desc id="desc">The model chooses a bash command, bash returns an observation, and the model chooses the next step.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5 0 9" fill="none" stroke="#087c77" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="638" height="343" rx="12" fill="#f7fafb" stroke="#dbe5e8"/>
<g fill="none" stroke="#087c77" stroke-width="2.5" marker-end="url(#arrow)"><path d="M280 100H352"/><path d="M490 143V187"/><path d="M360 232H289"/><path d="M150 192V151"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="30" y="55" width="250" height="90" rx="9" fill="#eaf5f2" stroke="#b9d9d3"/>
<text x="155" y="92" font-size="25" font-weight="600" fill="#075c59">Model decides</text><text x="155" y="121" font-size="18" fill="#4f6d73">task + current history</text>
<rect x="360" y="55" width="250" height="90" rx="9" fill="#fff" stroke="#cfdde1"/>
<text x="485" y="92" font-size="25" font-weight="600" fill="#18313d">Bash runs</text><text x="485" y="121" font-size="18" fill="#596c77">read, edit, or test</text>
<rect x="360" y="190" width="250" height="90" rx="9" fill="#fff" stroke="#cfdde1"/>
<text x="485" y="227" font-size="25" font-weight="600" fill="#18313d">Observe result</text><text x="485" y="256" font-size="18" fill="#596c77">output + return code</text>
<rect x="30" y="190" width="250" height="90" rx="9" fill="#eaf5f2" stroke="#b9d9d3"/>
<text x="155" y="227" font-size="25" font-weight="600" fill="#075c59">Choose next step</text><text x="155" y="256" font-size="18" fill="#4f6d73">continue or submit</text>
<text x="320" y="320" font-size="17" fill="#596c77">Repeat until submission or a run limit.</text>
</g></svg>
