name: Publish Lab 2 handout

# Manual publishing avoids exposing other material from the private TA repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab2-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the Markdown renderer
        run: python -m pip install markdown-it-py==4.2.0
      - name: Build the public handout only
        run: python labs/lab2/handout/build.py --output "$RUNNER_TEMP/lab2-pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/lab2-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the handout
        id: deployment
        uses: actions/deploy-pages@v4
