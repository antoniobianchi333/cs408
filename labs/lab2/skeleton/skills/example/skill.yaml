# Required. Unique identifier: lowercase letters, digits, and hyphens.
name: example

# Required. This summary is visible to the agent at the start of the run.
# Explain WHEN to use the skill; do not put its full instructions here.
description: >-
  Use when you need an explanation of the course skill-file format and
  how to locate a skill's optional supporting files.

# Required. The full text is read on demand, not inserted into the initial prompt.
# Use YAML's | notation for multiple lines. These are instructions, not executable YAML.
instructions: |
  This is a format example, not a testing strategy or a reference solution.

  1. When explaining this skill's format, identify the name, description,
     and instructions fields in this file.
  2. If more detail about loading or supporting files is needed, read
     references/format.md relative to this skill's directory.
  3. Do not read unrelated supporting files just because they exist.

  Replace this text with your own skill's instructions. Keep the skill
  consistent with the task's constraints.
