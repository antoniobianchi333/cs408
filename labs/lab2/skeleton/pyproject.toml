# Dependencies of the Lab 2 tools. The project itself is not installed:
# scripts/activate.sh puts the repository root on PYTHONPATH, and scripts/setup.py
# installs these requirements plus the two vendored packages into .venvs/.
[project]
name = "cs408-lab2"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["mini-swe-agent==2.4.6", "harbor==0.25.0", "udocker==1.3.17", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

# Vendored submodules (vendor/<name>) and the commits setup.py checks out.
[tool.cs408.vendor.mini-swe-agent]
repository = "https://github.com/SWE-agent/mini-swe-agent"
commit = "04d809ceab9df28f9adaed044884180159172930"

[tool.cs408.vendor.harbor]
# Harbor v0.25.0 (Apache-2.0)
repository = "https://github.com/harbor-framework/harbor"
commit = "fdba28fc411e47e8765420a1a063b4918fce3def"
