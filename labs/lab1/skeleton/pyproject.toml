[project]
name = "cs408-lab1"
version = "0.1.0"
description = "CS408 Project 1 - Fuzzing"
requires-python = ">=3.10"
dependencies = [
    "parsimonious==0.10.0",
    "click>=8.0",
    "tqdm>=4.60",
    "pyyaml>=6.0",
    "rich>=13.0",
    "psutil>=5.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401"]
